<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
    body{padding:18px;color:#202124;background:#fff;font-size:13px}
    h3{color:#0d47a1;font-size:14px;margin-bottom:6px}
    .sub{color:#5f6368;font-size:12px;margin-bottom:14px}
    .warn{background:#fce8b2;border-left:3px solid #f9ab00;padding:8px 10px;border-radius:2px;margin-bottom:12px;font-size:12px}
    .err {background:#fce8b2;border-left:3px solid #d93025;padding:8px 10px;border-radius:2px;margin-top:10px;font-size:12px}
    .ok  {background:#e6f4ea;border-left:3px solid #137333;padding:8px 10px;border-radius:2px;margin-top:10px;font-size:12px}
    .ok a{color:#137333;font-weight:bold}
    .hidden{display:none}
    .file-area{border:2px dashed #dadce0;border-radius:6px;padding:16px;text-align:center;cursor:pointer;margin-bottom:10px;transition:background .15s}
    .file-area:hover{background:#f8f9fa}
    #fileInput{display:none}
    .file-name{font-size:11px;color:#5f6368;margin-top:5px;min-height:15px}
    .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
    button{padding:7px 16px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
    #btnSubir{background:#1a73e8;color:#fff}
    #btnSubir:disabled{background:#9aa0a6;cursor:default}
    #btnCancel{background:#f1f3f4;color:#3c4043}
    .progress{margin-top:10px;font-size:12px;color:#1a73e8;line-height:1.6}
    .result-grid{margin-top:8px;font-size:12px;line-height:1.8}
    .result-grid b{display:inline-block;width:120px;color:#5f6368}
    #sizeErr{background:#fce8b2;border-left:3px solid #d93025;padding:6px 10px;border-radius:2px;margin-top:6px;font-size:12px}
  </style>
</head>
<body>
  <h3>📥 Subir factura PDF recibida</h3>
  <p class="sub">El sistema leerá el PDF y creará automáticamente el gasto en GASTOS.</p>

  <div class="file-area" onclick="document.getElementById('fileInput').click()">
    <div>📄 Haz clic para seleccionar la factura PDF</div>
    <input type="file" id="fileInput" accept="application/pdf" onchange="onFileChange(this)">
    <div class="file-name" id="fileName">Ningún archivo seleccionado</div>
  </div>

  <div id="sizeErr" class="hidden">El archivo supera 10 MB. Selecciona uno más pequeño.</div>
  <div id="progress" class="progress hidden"></div>
  <div id="resultado" class="hidden"></div>

  <div class="btns">
    <button id="btnCancel" onclick="google.script.host.close()">Cancelar</button>
    <button id="btnSubir" disabled onclick="subirFactura()">📤 Subir factura</button>
  </div>

<script>
  var MAX_BYTES = 10 * 1024 * 1024;
  var selectedFile = null;

  function onFileChange(inp) {
    document.getElementById('sizeErr').classList.add('hidden');
    document.getElementById('resultado').classList.add('hidden');
    if (!inp.files.length) { selectedFile = null; setBtn(false); return; }
    var f = inp.files[0];
    document.getElementById('fileName').textContent =
      f.name + ' (' + (f.size / 1048576).toFixed(2) + ' MB)';
    if (f.size > MAX_BYTES) {
      document.getElementById('sizeErr').classList.remove('hidden');
      selectedFile = null; setBtn(false); return;
    }
    selectedFile = f;
    setBtn(true);
  }

  function setBtn(on) {
    document.getElementById('btnSubir').disabled = !on;
  }

  function subirFactura() {
    if (!selectedFile) return;
    setBtn(false);
    document.getElementById('btnCancel').disabled = true;

    var prog = document.getElementById('progress');
    prog.innerHTML =
      '⏳ Subiendo PDF a Drive…<br>' +
      '🔍 Extrayendo texto (OCR Google Drive)…<br>' +
      '<small style="color:#888">Este proceso puede tardar 15–30 segundos. Por favor, espera.</small>';
    prog.classList.remove('hidden');

    var reader = new FileReader();
    reader.onload = function(e) {
      var b64 = e.target.result.split(',')[1];
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onError)
        .subirFacturaPdfGastoDesdePanel(selectedFile.name, b64);
    };
    reader.readAsDataURL(selectedFile);
  }

  function onSuccess(res) {
    document.getElementById('progress').classList.add('hidden');
    var el = document.getElementById('resultado');
    el.className = 'ok';

    var rows = '';
    if (res.id)        rows += '<div><b>ID gasto:</b> '    + res.id        + '</div>';
    if (res.proveedor) rows += '<div><b>Proveedor:</b> '  + res.proveedor + '</div>';
    if (res.total)     rows += '<div><b>Total:</b> '       + res.total     + ' €</div>';
    if (res.estadoOCR) rows += '<div><b>Estado OCR:</b> ' + res.estadoOCR + '</div>';

    el.innerHTML =
      '✅ Factura subida y gasto creado.<br>' +
      '<a href="' + res.url + '" target="_blank">Ver PDF en Drive</a>' +
      (rows ? '<div class="result-grid" style="margin-top:8px">' + rows + '</div>' : '') +
      '<div style="margin-top:8px;font-size:11px;color:#5f6368">' +
      '⚠️ Revisa los datos extraídos en PANEL_GASTOS — pueden necesitar corrección.</div>';
    el.classList.remove('hidden');
    document.getElementById('btnCancel').textContent = 'Cerrar';
    document.getElementById('btnCancel').disabled = false;
  }

  function onError(err) {
    document.getElementById('progress').classList.add('hidden');
    setBtn(true);
    document.getElementById('btnCancel').disabled = false;
    var el = document.getElementById('resultado');
    el.className = 'err';
    el.textContent = '❌ Error: ' + (err.message || err);
    el.classList.remove('hidden');
  }
</script>
</body>
</html>
