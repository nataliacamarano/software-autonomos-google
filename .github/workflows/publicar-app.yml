# Publica la carpeta app-instalable/ en GitHub Pages cada vez que cambia en main.
# Dirección: https://nataliacamarano.github.io/software-autonomos-google/
name: Publicar app instalable

on:
  push:
    branches: [main]
    paths:
      - 'app-instalable/**'
      - '.github/workflows/publicar-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app-instalable
      - id: deployment
        uses: actions/deploy-pages@v4
