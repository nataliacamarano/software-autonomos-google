<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Álvaro Gestión</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--txt:#1e1e1c;--mut:#6a6a64;--line:#e3e1da;--acc:#1b5fb0;--accbg:#e6effa;--ok:#1d7a45;--okbg:#e4f4ea;--warn:#8a5700;--warnbg:#fbf0d9;--bad:#b3261e;--badbg:#fbe7e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600}
.back{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer;color:var(--acc)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:8px;white-space:nowrap}
.p-acc{background:var(--accbg);color:var(--acc)}.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mut{background:#ececE6;color:var(--mut)}
main{padding:16px;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric small{display:block;color:var(--mut);font-size:12px}.metric b{font-size:22px;font-weight:600}
button.metric{font:inherit;color:var(--txt);text-align:left;cursor:pointer;width:100%}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;color:var(--txt);text-align:left;cursor:pointer;min-height:92px}
.tile .ic{font-size:26px;line-height:1}
.tile.wide{grid-column:1/3;flex-direction:row;align-items:center;min-height:0}
.big{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;font-size:16px;color:var(--txt);text-align:left;cursor:pointer;margin-bottom:12px}
h2{font-size:15px;margin:20px 0 6px;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfcdc5;border-radius:10px;background:#fff;color:var(--txt)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row2>div{min-width:0}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1px solid #cfcdc5;background:var(--card);font:inherit;font-size:16px;color:var(--txt);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.bad{color:var(--bad);border-color:#e2b4b0}
.btn.pri.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it.static{cursor:default}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.av.mut{background:#ececE6;color:var(--mut)}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow span{display:block;font-size:13px;color:var(--mut)}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:#efeee9;color:var(--mut);margin:10px 0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:5px 11px;border:1px solid #cfcdc5;border-radius:16px;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.seg{display:flex;gap:4px;padding:3px;background:#e9e8e2;border-radius:10px}.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--txt)}.seg button.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 20px}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px 22px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none}
#toast.bad{background:var(--bad)}
.mthumb{width:46px;height:46px;border-radius:10px;background:#ececE6;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.mthumb img{width:100%;height:100%;object-fit:cover}
.mph{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#ececE6;display:flex;align-items:center;justify-content:center;font-size:56px}.mph img{width:100%;height:100%;object-fit:cover}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.grid4 .metric.on{border-color:var(--acc);background:var(--accbg)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice{padding:13px 8px;border:1px solid #cfcdc5;border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--txt);cursor:pointer;text-align:center}
.choice.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{border:1px dashed #9a9890;border-radius:12px;padding:10px;text-align:center;background:#fff;break-inside:avoid}
.label canvas{max-width:100%;height:auto}.label b{display:block;font-size:14px}.label span{display:block;font-size:12px;color:var(--mut);font-family:monospace}
.hist{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.hist b{font-size:13px}.hist .why{margin-top:3px;padding:6px 8px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
@media print{html,body{background:#fff}.bar,#toast,.noprint,.ov{display:none!important}main{padding:0}#app{max-width:none;background:#fff}.labels{grid-template-columns:repeat(3,1fr)}}
.center{padding:60px 24px;text-align:center;color:var(--mut)}
.center b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.empty{color:var(--mut);font-size:14px;padding:12px 0}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #ccc;border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>

/* Teléfonos de cualquier país: con "+prefijo" o "00prefijo" se usa tal cual; un número español de 9 cifras
   sin prefijo se entiende como +34; cualquier otro caso abre WhatsApp sin número para elegir el contacto. */
var PAIS_DEFECTO = '34';
function waUrl(tel, texto) {
  var s = String(tel || '').replace(/^[\s(]+/, ''), d = s.replace(/\D/g, ''), num = '';
  if (s.charAt(0) === '+') num = d;
  else if (s.slice(0, 2) === '00') num = d.slice(2);
  else if (/^[6-9]\d{8}$/.test(d)) num = PAIS_DEFECTO + d;
  if (num.length < 8 || num.length > 15) num = '';
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(texto);
}

  var foto = photoPicker(1, m.foto ? 'Cambiar la foto' : 'Hacer foto a la máquina');
  var enlace = inp('url', 'https://… (opcional)', m.enlace || ''); enlace.setAttribute('inputmode', 'url');
  var n = el('div', null, foto.node, field('Nombre', nom), el('div', { class: 'row2' }, field('Tipo', tipo), field('Marca y modelo', marca)), field('Combustible', comb),
    el('div', { class: 'row2' }, field('Fecha de compra', compra), field('Nº de serie', serie)), field('Enlace de la tienda', enlace), field('Notas', notas),
    repSeccion(m),
    submitBtn('Guardar cambios', function () {
      need(nom.value.trim(), 'Escribe el nombre de la máquina.'); need(!foto.isBusy(), 'Espera a que termine de cargar la foto.');
      var f = foto.get();
      return api('maqEditar', { reqId: reqId, id: m.id, datos: { nombre: nom.value, tipo: tipo.value, marca: marca.value, serie: serie.value, combustible: comb.value, fechaCompra: compra.value, enlace: enlace.value.trim(), notas: notas.value, foto: f[0] || null } })
        .then(function () { return refreshInit(); }).then(function () { toast('Cambios guardados'); S.stack.pop(); var t = S.stack[S.stack.length - 1]; t.fn(t.arg); });
    }));
  show('Editar máquina', n);
}

function viewMaqQR(x) {
  var c = qrCanvas(x.qr, 280); c.style.width = '100%'; c.style.maxWidth = '280px'; c.style.height = 'auto';
  var n = el('div', null,
    x.nuevo ? el('div', { class: 'note noprint', style: 'background:var(--okbg);color:var(--ok)', text: 'Máquina guardada. Imprime esta etiqueta y pégala en la máquina: al escanearla con el móvil se abre su pantalla.' }) : null,
    el('div', { class: 'label', style: 'max-width:340px;margin:0 auto;padding:16px' }, c, el('b', { style: 'font-size:18px;margin-top:8px', text: x.nombre }), el('span', { text: x.id })),
    el('button', { class: 'btn pri noprint', text: '🖨️ Imprimir etiqueta', onclick: imprimir }),
    el('button', { class: 'btn noprint', text: 'Guardar imagen', onclick: function () { descargarQR(c, x); } }),
    el('p', { class: 'empty noprint', style: 'word-break:break-all', text: 'Dirección del QR: ' + x.qr }));
  show('Etiqueta QR', n);
}

function viewMaqEtiquetas() {
  loading('Etiquetas QR');
  api('maqLista').then(function (r) {
    var act = r.maquinas.filter(function (m) { return m.activo; });
    if (!act.length) { toast('Todavía no hay máquinas.', true); back(); return; }
    var grid = el('div', { class: 'labels' });
    act.forEach(function (m) { grid.appendChild(el('div', { class: 'label' }, qrCanvas(m.qr, 220), el('b', { text: m.nombre }), el('span', { text: m.id }))); });
    show('Etiquetas QR', el('div', null,
      el('button', { class: 'btn pri noprint', text: '🖨️ Imprimir todas (' + act.length + ')', onclick: imprimir }),
      el('p', { class: 'empty noprint', text: 'Recórtalas por la línea de puntos y pégalas; mejor con cinta transparente por encima para que aguanten el agua y el sol.' }), grid));
  }).catch(function (e) { toast(e.error, true); back(); });
}

/* Registrar el uso de una máquina (al escanear su QR o desde la lista). */
function viewMaqUso(id) {
  loading('Registrar uso');
  api('maqFicha', { id: id }).then(function (r) {
    var m = r.maquina, d = S.init, reqId = rid();
    var defCli = d.trabajos && d.trabajos.length ? d.trabajos[0].cliente : '';
    var cliente = sel(d.clientes, defCli, 'Elige cliente');
    var admin = d.rol === 'admin';
    var quien = admin ? sel([{ v: '', t: 'Yo (' + d.nombre + ')' }].concat((d.operarios || []).filter(function (o) { return o !== d.nombre; }).map(function (o) { return { v: o, t: o }; })), '') : null;
    var dejada = '', cajas = el('div', { class: 'choices' });
    ['Sigo usándola yo', 'En casa del cliente', 'En la camioneta', 'En el depósito'].forEach(function (o) {
      var b = el('button', { type: 'button', class: 'choice', text: o });
      b.addEventListener('click', function () { dejada = o; [].forEach.call(cajas.children, function (c) { c.classList.toggle('on', c === b); }); });
      cajas.appendChild(b);
    });
    var inc = false, bNo = el('button', { type: 'button', class: 'choice on', text: 'No' }), bSi = el('button', { type: 'button', class: 'choice', text: 'Sí, hubo un problema' });
    var desc = el('textarea', { placeholder: 'Qué ha pasado' }), res = sel(['Sigue en servicio', 'En reparación', 'Rota'], 'Sigue en servicio');
    var extra = el('div', { style: 'display:none' }, field('¿Qué ha pasado?', desc), field('¿Cómo ha quedado la máquina?', res));
    function setInc(v) { inc = v; bNo.classList.toggle('on', !v); bSi.classList.toggle('on', v); extra.style.display = v ? '' : 'none'; }
    bNo.addEventListener('click', function () { setInc(false); }); bSi.addEventListener('click', function () { setInc(true); });
    var n = el('div', null,
      el('div', { style: 'display:flex;align-items:center;gap:12px;margin-bottom:8px' }, maqThumb(m),
        el('div', { class: 'grow' }, el('b', { text: m.nombre }), el('span', { text: [m.tipo, m.combustible, 'Ahora: ' + (m.ubic || '—')].filter(Boolean).join(' · ') })),
        el('span', { class: 'pill ' + MAQ_PILL[m.estado], text: m.estado })),
      maqRota(m) ? el('div', { class: 'note', style: 'background:var(--badbg);color:var(--bad)', text: 'Figura como ' + m.estado.toLowerCase() + '. No la uses y avisa a Álvaro.' }) : null,
      admin ? field('¿Quién la ha usado?', quien) : el('p', { class: 'empty', style: 'margin:0 0 4px', text: 'Se anotará a nombre de ' + d.nombre + '.' }),
      field(admin ? 'Cliente donde se ha usado' : 'Cliente donde la has usado', cliente),
      el('label', { text: '¿Dónde la has dejado?' }), cajas,
      el('label', { text: '¿Ha habido algún incidente?' }), el('div', { class: 'choices' }, bNo, bSi), extra,
      submitBtn('Registrar uso', function () {
        need(cliente.value, 'Elige el cliente donde la has usado.'); need(dejada, 'Indica dónde has dejado la máquina.');
        if (inc) need(desc.value.trim().length >= 3, 'Cuenta qué ha pasado con la máquina.');
        return api('maqUso', { reqId: reqId, id: m.id, cliente: cliente.value, operario: admin ? quien.value : '', dejadaEn: dejada, incidencia: inc, descripcion: desc.value, resultado: inc ? res.value : '' })
          .then(function (u) { return refreshInit().then(function () { doneMaq(u); }); });
      }));
    show('Registrar uso', n);
  }).catch(function (e) { toast(e.error, true); back(); });
}
function doneMaq(u) {
  var aviso = u.estado === 'Rota' ? ' Queda marcada como ROTA: Álvaro la verá en su lista.' : (u.estado === 'En reparación' ? ' Queda marcada EN REPARACIÓN.' : '');
  done('Uso registrado', u.nombre + ': ' + u.estado + ' · ' + u.ubicacion + (u.trabajo ? ' · añadida al trabajo ' + u.trabajo : '') + '.' + aviso);
}

/* ---------- arranque ---------- */
(function boot() {
  if (!TOKEN) {
    if (MAQ) fatal('Primero, tu enlace personal', 'Es la primera vez que escaneas una máquina en este móvil. Abre una vez el enlace personal que te envió Álvaro; después, el QR de cada máquina abrirá directamente su pantalla de uso.');
    else fatal('Entra desde tu enlace personal', 'Pide a Álvaro que te lo envíe.');
    return;
  }
  loading();
  api('init').then(function (d) {
    S.init = d;
    var fn = d.rol === 'admin' ? adminHome : empHome;
    S.stack = [{ fn: fn }];
    if (MAQ) {   // entró escaneando el QR de una máquina: Álvaro ve su ficha; el empleado, registrar el uso
      var pantalla = d.rol === 'admin' ? viewMaqFicha : viewMaqUso;
      S.stack.push({ fn: pantalla, arg: MAQ });
      pantalla(MAQ);
    } else fn();
  }).catch(function (e) {
    if (e.code === 'AUTH') { try { localStorage.removeItem('wa_t'); } catch (_) {} }
    fatal(e.code === 'BLOQ' ? 'Acceso desactivado' : (e.code === 'AUTH' ? 'Enlace no válido' : 'No se pudo abrir'), e.error || '');
  });
})();
</script>
</body>
</html>
