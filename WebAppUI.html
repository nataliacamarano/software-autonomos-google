<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Álvaro Gestión</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--txt:#1e1e1c;--mut:#6a6a64;--line:#e3e1da;--acc:#1b5fb0;--accbg:#e6effa;--ok:#1d7a45;--okbg:#e4f4ea;--warn:#8a5700;--warnbg:#fbf0d9;--bad:#b3261e;--badbg:#fbe7e5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:17px;font-weight:600}
.back{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px 4px 0;cursor:pointer;color:var(--acc)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:8px;white-space:nowrap}
.p-acc{background:var(--accbg);color:var(--acc)}.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mut{background:#ececE6;color:var(--mut)}
main{padding:16px;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric small{display:block;color:var(--mut);font-size:12px}.metric b{font-size:22px;font-weight:600}
button.metric{font:inherit;color:var(--txt);text-align:left;cursor:pointer;width:100%}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;color:var(--txt);text-align:left;cursor:pointer;min-height:92px}
.tile .ic{font-size:26px;line-height:1}
.tile.wide{grid-column:1/3;flex-direction:row;align-items:center;min-height:0}
.big{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font:inherit;font-size:16px;color:var(--txt);text-align:left;cursor:pointer;margin-bottom:12px}
h2{font-size:15px;margin:20px 0 6px;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cfcdc5;border-radius:10px;background:#fff;color:var(--txt)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row2>div{min-width:0}
.btn{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1px solid #cfcdc5;background:var(--card);font:inherit;font-size:16px;color:var(--txt);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.bad{color:var(--bad);border-color:#e2b4b0}
.btn.pri.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it.static{cursor:default}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.av.mut{background:#ececE6;color:var(--mut)}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow span{display:block;font-size:13px;color:var(--mut)}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:#efeee9;color:var(--mut);margin:10px 0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:5px 11px;border:1px solid #cfcdc5;border-radius:16px;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.seg{display:flex;gap:4px;padding:3px;background:#e9e8e2;border-radius:10px}.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--txt)}.seg button.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 20px}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px 22px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.ph img{width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90%;background:#222;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;display:none}
#toast.bad{background:var(--bad)}
.mthumb{width:46px;height:46px;border-radius:10px;background:#ececE6;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.mthumb img{width:100%;height:100%;object-fit:cover}
.mph{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#ececE6;display:flex;align-items:center;justify-content:center;font-size:56px}.mph img{width:100%;height:100%;object-fit:cover}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.grid4 .metric.on{border-color:var(--acc);background:var(--accbg)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choice{padding:13px 8px;border:1px solid #cfcdc5;border-radius:12px;background:#fff;font:inherit;font-size:15px;color:var(--txt);cursor:pointer;text-align:center}
.choice.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:8px 0}.cal .dow{font-size:11px;color:var(--mut);text-align:center;padding:2px 0}
.cal .dia{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 2px;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--txt)}
.cal .dia.fuera{background:transparent;border-color:transparent;cursor:default}.cal .dia.hoy{border:2px solid var(--acc)}.cal .dia.sel{background:var(--accbg)}
.cal .dia i{font-style:normal;font-size:10px;line-height:1.2;padding:1px 5px;border-radius:6px}.cal .dia .t{background:var(--okbg);color:var(--ok);font-weight:600}.cal .dia .a{background:var(--warnbg);color:var(--warn)}.cal .dia .h{background:var(--okbg);color:var(--ok)}
.mes{display:flex;align-items:center;gap:8px}.mes b{flex:1;text-align:center;font-size:17px;text-transform:capitalize}.mes button{border:1px solid var(--line);background:#fff;border-radius:10px;font-size:20px;line-height:1;padding:6px 14px;cursor:pointer;color:var(--acc)}
.tarea{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.tarea input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}.tarea.hecha .tt{text-decoration:line-through;color:var(--mut)}.tarea .tt{font-weight:600}.tarea small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.cal .dia .n{background:var(--badbg);color:var(--bad);font-weight:600}
.nota{background:#fff;border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:12px;padding:12px;margin:8px 0}.hist.tra{border-left:5px solid var(--ok);padding-left:10px;background:var(--okbg);border-radius:8px;margin:6px 0;border-bottom:0}.nota .nt{display:flex;gap:8px;align-items:flex-start}.nota .nt b{flex:1;font-size:15px}
.nota .meta{font-size:12px;color:var(--mut);margin-top:2px}.nota .txt{font-size:14px;margin-top:6px;white-space:pre-wrap}
.nota .pt{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}.nota .pt input{width:22px;height:22px;flex:none}.nota .pt.h span{text-decoration:line-through;color:var(--mut)}
.nota.hecha{opacity:.7}.pbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--ok)}
.fila-pt{display:flex;gap:8px;align-items:center;margin:6px 0}.fila-pt input[type=checkbox]{width:22px;height:22px;flex:none}.fila-pt input[type=text]{flex:1}.fila-pt button{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--bad)}
.hist.tra.atras,.nota.atras,.tarea.atras{background:var(--badbg);border-left:5px solid var(--bad);padding-left:10px;border-radius:8px}.tarea.atras .tt{color:var(--bad)}
.cal .dia.atras{border:2px solid var(--bad);background:var(--badbg)}.cal .dia .o{background:var(--bad);color:#fff;font-weight:700}
.tile.alerta{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
.pen{display:flex;gap:10px;align-items:flex-start;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.pen .ic{font-size:20px;line-height:1.2}.pen.atras{background:var(--badbg);border-color:var(--bad);border-left-width:5px}.pen.atras b{color:var(--bad)}
.pen small{display:block;color:var(--mut);font-size:12px}.pen .cuando{font-size:12px;font-weight:600;white-space:nowrap}.pen.atras .cuando{color:var(--bad)}
.libreta{width:100%;min-height:58vh;resize:vertical;font:inherit;font-size:16px;line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffef8}
.estado-lib{font-size:13px;color:var(--mut);margin:6px 2px 10px;min-height:18px}.estado-lib.mal{color:var(--bad);font-weight:600}.estado-lib.ok{color:var(--ok)}
.prevlib{white-space:pre-wrap;background:#fffef8;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:180px;overflow:hidden;position:relative}
.cal .dia .l{background:#f3efe0;color:#6b5a1a}
#nueva{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--acc);color:#fff;text-align:center;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}#nueva small{display:block;font-weight:400;font-size:12px;opacity:.9}
.mk{display:inline-block;width:16px;height:16px;min-width:16px;border-radius:50%;margin:0 6px 0 0;padding:0;border:2px solid transparent;vertical-align:middle;flex:none;background:none}
button.mk{cursor:pointer}.mk.rojo{background:#d93025}.mk.naranja{background:#f29900}.mk.amarillo{background:#f6c026}.mk.verde{background:#1e8e3e}.mk.azul{background:#1a73e8}.mk.vacio{border-color:#b9b7ae}
.mkfila{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 2px}.mkop{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;max-width:70px;padding:6px 4px;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:11px;color:var(--mut);cursor:pointer;line-height:1.15;text-align:center}.mkop.on{border-color:var(--acc);background:var(--accbg);color:var(--txt)}.mkop .mk{width:22px;height:22px;margin:0}
.mkley{display:flex;align-items:center;gap:10px;margin:8px 0}.mkley .mk{width:22px;height:22px}.mkley input{flex:1}
.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.label{border:1px dashed #9a9890;border-radius:12px;padding:10px;text-align:center;background:#fff;break-inside:avoid}
.label canvas{max-width:100%;height:auto}.label b{display:block;font-size:14px}.label .emp{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#000;font-family:inherit;margin-bottom:6px}.label span{display:block;font-size:12px;color:var(--mut);font-family:monospace}
.hist{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.hist b{font-size:13px}.hist .why{margin-top:3px;padding:6px 8px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
@media print{html,body{background:#fff}.bar,#toast,.noprint,.ov{display:none!important}main{padding:0}#app{max-width:none;background:#fff}.labels{grid-template-columns:repeat(3,1fr)}}
.center{padding:60px 24px;text-align:center;color:var(--mut)}
.center b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.empty{color:var(--mut);font-size:14px;padding:12px 0}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #ccc;border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>

<script>
var TOKEN = <?!= tokenJson ?>;
var MAQ = <?!= maqJson ?>;   // código de máquina cuando se entra escaneando su QR
var VERSION = <?!= versionJson ?>;   // versión con la que se cargó esta pantalla
var WRAP = <?!= wrapJson ?>;   // true si se abrió dentro de la app instalable (muestra el botón de Ajustes)
/* El móvil recuerda el enlace personal para que el QR de una máquina abra directamente, sin volver a pedirlo. */
try { if (TOKEN) localStorage.setItem('wa_t', TOKEN); else TOKEN = localStorage.getItem('wa_t') || ''; } catch (e) {}
var S = { init: null, stack: [] };
var app = document.getElementById('app');

/* ---------- utilidades ---------- */
function el(tag, props) {
  var n = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (v == null || v === false) return;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v === true ? '' : v);
  });
  for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
  return n;
}
function add(n, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(n, x); }); return; }
  n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
}
function toast(msg, bad) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, bad ? 5000 : 2500);
}
function rid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function eur(n) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function horas(n) { return (Number(n) || 0).toLocaleString('es-ES', { maximumFractionDigits: 1 }) + ' h'; }
function ini(n) { return String(n || '?').split(' ').filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase(); }

function api(action, payload) {
  return new Promise(function (res, rej) {
    if (!window.google || !google.script || !google.script.run) { rej({ error: 'No se puede conectar con el servidor.' }); return; }
    google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) res(r.data); else rej(r || { error: 'Sin respuesta del servidor.' }); })
      .withFailureHandler(function () { rej({ error: 'Sin conexión. Revisa internet e inténtalo otra vez.' }); })
      .wa_api(TOKEN, action, payload || {});
  });
}

/* ---------- pantallas ---------- */
function show(title, node, opts) {
  opts = opts || {};
  app.innerHTML = '';
  var bar = el('div', { class: 'bar' });
  if (S.stack.length > 1 && !opts.noBack) bar.appendChild(el('button', { class: 'back', 'aria-label': 'Volver', text: '‹', onclick: back }));
  bar.appendChild(el('h1', { text: title }));
  if (S.init) bar.appendChild(el('span', { class: 'pill ' + (S.init.rol === 'admin' ? 'p-acc' : 'p-mut'), text: S.init.rol === 'admin' ? 'Admin' : 'Empleado' }));
  // Solo en la pantalla de inicio y dentro de la app instalable: Ajustes (PIN y cerrar sesión).
  if (WRAP && S.stack.length <= 1) bar.appendChild(el('button', { class: 'back', 'aria-label': 'Ajustes de la app', title: 'Ajustes', text: '⚙️', style: 'padding:4px 0 4px 4px;font-size:20px',
    onclick: function () { try { window.top.postMessage('ag-ajustes', '*'); } catch (e) {} } }));
  app.appendChild(bar);
  var m = el('main'); m.appendChild(node); app.appendChild(m);
  window.scrollTo(0, 0);
}
function go(fn, arg) { S.stack.push({ fn: fn, arg: arg }); fn(arg); }
function back() { if (S.stack.length > 1) { S.stack.pop(); var t = S.stack[S.stack.length - 1]; t.fn(t.arg); } }
function home() { S.stack = [S.stack[0]]; S.stack[0].fn(S.stack[0].arg); }
function loading(title) { show(title || 'Álvaro Gestión', el('div', { class: 'center' }, el('span', { class: 'spin' })), { noBack: true }); }
function fatal(title, msg) { app.innerHTML = ''; app.appendChild(el('div', { class: 'center' }, el('b', { text: title }), msg)); }

function done(title, msg) {
  var n = el('div', { class: 'ok' },
    el('div', { class: 'tick', text: '✓' }),
    el('b', { text: title }), el('p', { class: 'empty', text: msg || '' }),
    el('button', { class: 'btn', text: 'Volver al inicio', onclick: function () { refreshInit().then(home); } }));
  show('Listo', n, { noBack: true });
}
function refreshInit() { return api('init').then(function (d) { S.init = d; }).catch(function () {}); }

/* ---------- componentes de formulario ---------- */
function field(label, input) { return el('div', null, el('label', { text: label }), input); }
function sel(options, value, blank) {
  var s = el('select');
  if (blank) s.appendChild(el('option', { value: '', text: blank }));
  options.forEach(function (o) { var v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o; var op = el('option', { value: v, text: t }); if (value === v) op.selected = true; s.appendChild(op); });
  return s;
}
function inp(type, ph, value) { return el('input', { type: type, placeholder: ph || '', value: value || '', autocomplete: 'off' }); }

function resizeImage(file, maxDim) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxDim / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var d = c.toDataURL('image/jpeg', 0.82);
      res({ name: 'foto.jpg', mime: 'image/jpeg', b64: d.split(',')[1], thumb: d });
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la foto.')); };
    img.src = url;
  });
}
function photoPicker(max, label) {
  var list = [], box = el('div', { class: 'photos' }), busy = false;
  var file = el('input', { type: 'file', accept: 'image/*', multiple: max > 1, style: 'display:none' });
  var btn = el('button', { type: 'button', class: 'btn', text: '📷 ' + label, onclick: function () { file.click(); } });
  function draw() {
    box.innerHTML = '';
    list.forEach(function (p, i) {
      box.appendChild(el('div', { class: 'ph' }, el('img', { src: p.thumb, alt: 'Foto ' + (i + 1) }),
        el('button', { type: 'button', 'aria-label': 'Quitar foto', text: '×', onclick: function () { list.splice(i, 1); draw(); } })));
    });
    btn.style.display = list.length >= max ? 'none' : '';
  }
  file.addEventListener('change', function () {
    var files = Array.prototype.slice.call(file.files).slice(0, max - list.length);
    busy = true; btn.disabled = true;
    Promise.all(files.map(function (f) { return resizeImage(f, 1600); }))

  var s = String(tel || '').replace(/^[\s(]+/, ''), d = s.replace(/\D/g, ''), num = '';

/* QR sobre fondo blanco con zona de silencio, listo para imprimir. */
var EMPRESA = 'Álvaro Mantenimiento';
function qrCanvas(texto, px) {
  var q = qrcode(0, 'M'); q.addData(texto); q.make();
  var n = q.getModuleCount(), quiet = 4, cell = Math.max(2, Math.floor(px / (n + quiet * 2))), size = (n + quiet * 2) * cell;
  var c = document.createElement('canvas'); c.width = size; c.height = size;
  var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size); g.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) if (q.isDark(r, k)) g.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
  return c;
}

  var g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
  g.fillStyle = '#000'; g.textAlign = 'center'; g.font = 'bold 20px Arial'; g.fillText(EMPRESA.toUpperCase(), out.width / 2, 32);
  g.drawImage(canvas, 20, 46);
  g.font = 'bold 22px Arial'; g.fillText(x.nombre, out.width / 2, canvas.height + 96);
  g.font = '16px monospace'; g.fillStyle = '#555'; g.fillText(x.id, out.width / 2, canvas.height + 120);
  var a = document.createElement('a'); a.href = out.toDataURL('image/png'); a.download = x.id + '.png';

}

    bNo.addEventListener('click', function () { setInc(false); }); bSi.addEventListener('click', function () { setInc(true); });
    var n = el('div', null,
      el('div', { style: 'display:flex;align-items:center;gap:12px;margin-bottom:8px' }, maqThumb(m),
        el('div', { class: 'grow' }, el('b', { text: m.nombre }), el('span', { text: [m.tipo, m.combustible, 'Ahora: ' + (m.ubic || '—')].filter(Boolean).join(' · ') })),
        el('span', { class: 'pill ' + MAQ_PILL[m.estado], text: m.estado })),
      maqRota(m) ? el('div', { class: 'note', style: 'background:var(--badbg);color:var(--bad)', text: 'Figura como ' + m.estado.toLowerCase() + '. No la uses y avisa a Álvaro.' }) : null,
      admin ? field('¿Quién la ha usado?', quien) : el('p', { class: 'empty', style: 'margin:0 0 4px', text: 'Se anotará a nombre de ' + d.nombre + '.' }),
      field(admin ? 'Cliente donde se ha usado' : 'Cliente donde la has usado', cliente),
      el('label', { text: '¿Dónde la has dejado?' }), cajas, cajaLugar,
      el('label', { text: '¿Ha habido algún incidente?' }), el('div', { class: 'choices' }, bNo, bSi), extra,
      submitBtn('Registrar uso', function () {
        need(cliente.value, 'Elige el cliente donde la has usado.'); need(dejada, 'Indica dónde has dejado la máquina.'); if (dejada === 'En otro sitio') need(lugar.value.trim().length >= 3, 'Escribe dónde la has dejado.');
        if (inc) need(desc.value.trim().length >= 3, 'Cuenta qué ha pasado con la máquina.');
        return api('maqUso', { reqId: reqId, id: m.id, cliente: cliente.value, operario: admin ? quien.value : '', dejadaEn: dejada, lugar: lugar.value, incidencia: inc, descripcion: desc.value, resultado: inc ? res.value : '' })
          .then(function (u) { return refreshInit().then(function () { doneMaq(u); }); });
      }));
    show('Registrar uso', n);
  }).catch(function (e) { toast(e.error, true); back(); });
}
function doneMaq(u) {
  var aviso = u.estado === 'Rota' ? ' Queda marcada como ROTA: Álvaro la verá en su lista.' : (u.estado === 'En reparación' ? ' Queda marcada EN REPARACIÓN.' : '');
  done('Uso registrado', u.nombre + ': ' + u.estado + ' · ' + u.ubicacion + (u.trabajo ? ' · añadida al trabajo ' + u.trabajo : '') + '.' + aviso);
}

/* ---------- arranque ---------- */
/* ---------- aviso de versión nueva ---------- */
var VER = { avisado: false, ultimo: 0 };
function compruebaVersion() {
  if (VER.avisado || !TOKEN || !VERSION) return;
  if (Date.now() - VER.ultimo < 20000) return;   // no más de una vez cada 20 s
  VER.ultimo = Date.now();
  api('version').then(function (r) { if (r && r.v && r.v !== VERSION) avisoVersion(r.url); }).catch(function () {});
}
function avisoVersion(urlApp) {
  if (VER.avisado) return;
  VER.avisado = true;
  var url = (urlApp || '') + '?t=' + encodeURIComponent(TOKEN) + (MAQ ? '&m=' + encodeURIComponent(MAQ) : '');
  var b = el('div', { id: 'nueva', role: 'button', onclick: function () {
    // Dentro de la app instalable: se le pide a la "puerta de entrada" que recargue el programa.
    // Si no hay puerta de entrada (enlace antiguo), a los 1,5 s se abre la dirección de Google como antes.
    try { window.top.postMessage('ag-recargar', '*'); } catch (e) {}
    setTimeout(function () { try { window.open(url, '_top'); } catch (e) { location.reload(); } }, 1500);
  } },
    'Hay una versión nueva de la app', el('small', { text: 'Toca aquí para actualizar (guarda antes lo que estés escribiendo)' }));
  document.body.appendChild(b);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) compruebaVersion(); });
setInterval(compruebaVersion, 5 * 60 * 1000);

(function boot() {
  if (!TOKEN) {
    if (MAQ) fatal('Primero, tu enlace personal', 'Es la primera vez que escaneas una máquina en este móvil. Abre una vez el enlace personal que te envió Álvaro; después, el QR de cada máquina abrirá directamente su pantalla de uso.');
    else fatal('Entra desde tu enlace personal', 'Pide a Álvaro que te lo envíe.');
    return;
  }
  loading();
  api('init').then(function (d) {
    S.init = d;
    compruebaVersion();
    var fn = d.rol === 'admin' ? adminHome : empHome;
    S.stack = [{ fn: fn }];
    if (MAQ) {   // entró escaneando el QR de una máquina: Álvaro ve su ficha; el empleado, registrar el uso
      var pantalla = d.rol === 'admin' ? viewMaqFicha : viewMaqUso;
      S.stack.push({ fn: pantalla, arg: MAQ });
      pantalla(MAQ);
    } else fn();
  }).catch(function (e) {
    if (e.code === 'AUTH') {
      try { localStorage.removeItem('wa_t'); } catch (_) {}
      // Dentro de la app instalable: se le avisa para que olvide el enlace y pida otro.
      try { window.top.postMessage('ag-enlace-invalido', '*'); } catch (_) {}
    }
    fatal(e.code === 'BLOQ' ? 'Acceso desactivado' : (e.code === 'AUTH' ? 'Enlace no válido' : 'No se pudo abrir'), e.error || '');
  });
})();
</script>
